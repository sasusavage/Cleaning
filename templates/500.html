<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | Done-Well Cleaning</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { margin: 0; font-family: 'Inter', Arial, sans-serif; background: #f8fafc; color: #374151; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { background: #fff; border-radius: 1rem; padding: 3rem 2.5rem; max-width: 480px; width: 90%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .error-code { font-size: 5rem; font-weight: 800; color: #1e3a5f; line-height: 1; margin-bottom: 0.5rem; }
        h1 { font-size: 1.4rem; color: #1e3a5f; margin: 0 0 1rem; }
        p { color: #6b7280; font-size: 0.95rem; line-height: 1.6; margin: 0 0 1.5rem; }
        a { display: inline-block; padding: 0.65rem 1.5rem; background: linear-gradient(135deg, #1e3a5f, #2563eb); color: #fff; border-radius: 0.5rem; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        a:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">500</div>
        <h1>Something went wrong</h1>
        <p>We encountered an unexpected error. Our team has been notified. Please try again in a moment.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
